[project]
name = "hil-serl"
version = "0.1.0"
description = "Human-in-the-Loop Soft Actor-Critic for Robotic Manipulation"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.24.3,<2.0.0",
    "torch>=2.4.1",
    "torchvision>=0.19.1",
    "torchaudio>=2.4.1",
    "gymnasium==0.29.1",
    "opencv-python>=4.10.0.84",
    "einops>=0.6.1",
    "ml_collections>=0.1.0",
    "tqdm>=4.60.0",
    "absl-py>=0.12.0",
    "scipy==1.11.4",
    "wandb>=0.12.14",
    "imageio>=2.31.1",
    "matplotlib>=3.7.0",
    "pynput>=1.7.6",
    "natsort>=8.4.0",
    "requests>=2.31.0",
    "flask>=3.0.0",
    "pyzmq>=25.0.0",
    "lz4>=4.3.0",
    "agentlace>=0.1.3",
    "timm>=1.0.0",
    "pytest>=8.0.0",
    "jaxtyping>=0.2.20",
    "beartype>=0.18.0",
]

[project.urls]
Repository = "https://github.com/rail-berkeley/hil-serl"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pre-commit>=3.3.0",
    "ipykernel>=6.29.0",
]

[tool.uv]
override-dependencies = [
    # Override if needed for compatibility
]

[tool.uv.sources]
agentlace = { git = "https://github.com/youliangtan/agentlace.git", rev = "cf2c337c5e3694cdbfc14831b239bd657bc4894d" }

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

ignore = ["E501", "I001"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["serl_launcher*", "serl_robot_infra*", "examples*"]

[tool.pytest.ini_options]
testpaths = ["tests", "serl_launcher/tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v"
